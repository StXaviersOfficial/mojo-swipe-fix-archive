name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Test cmake directly
        run: |
          cmake \
            -S dnbglfw/src/main/cpp \
            -B /tmp/cmake_test \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=21 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NDK=/opt/hostedtoolcache/ndk/r29/x64 \
            -DCMAKE_TOOLCHAIN_FILE=/opt/hostedtoolcache/ndk/r29/x64/build/cmake/android.toolchain.cmake \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -GNinja 2>&1 || true
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
